ignore_paths = [
    # Lists words on purpose.
    "codebook.toml",
    "**/LICENSE",
    # Lists misspellings on purpose.
    "codebook/configuration/codebook/codebook.toml",
    # Generated and rewritten by btop.
    "btop/configuration/btop/btop.conf",
    # Third-party code.
    "textadept/configuration/textadept/modules/lsp/**",
    "yazi/configuration/yazi/plugins/**",
]

ignore_patterns = [
    # Colour format specifier.
    'rrggbbaa',
    # KDE colour scheme files and their groups.
    '\.colors\b',
    '\bColors:',
    # Plural acronyms such as UUIDs, which would otherwise split into UUI and Ds.
    '\b[A-Z]{2,}s\b',
    # Constants and environment variables such as XDG_CONFIG_HOME.
    '\b[A-Z][A-Z0-9]*_[A-Z0-9_]+\b',
    # Command line options such as --no-linenumbers.
    '''(?:^|[\s"'=])--?[A-Za-z][\w-]*''',
    # Quoted paths.
    '"[^"\n]*/[^"\n]*"',
]

# Highlight groups shared by editor themes.
[[overrides]]
paths = ["zed/**"]
extra_words = ["preproc"]

# Keys in JSON settings are defined by the program reading them.
[[overrides]]
paths = ["**/*.json", "**/*.jsonc"]
extra_ignore_patterns = ['"[\w-]+"\s*:']

[[overrides]]
paths = ["bash/**"]
extra_words = [
    "erasedups",
    "HISTCONTROL",
    "HISTFILE",
    "histappend",
    "icat",
    "ignoredups",
    "lla",
    "mktemp",
]
# Templates passed to mktemp.
extra_ignore_patterns = ['X{6,}']

[[overrides]]
paths = ["**/*.tmTheme.esh"]
extra_words = ["invisibles"]

[[overrides]]
paths = ["kde/data/theme-hooks/kde"]
extra_words = ["offscreen"]

[[overrides]]
paths = ["fastfetch/configuration/fastfetch/config.jsonc"]
# Module names.
extra_words = [
    "colors",
    "terminalfont",
]

[[overrides]]
paths = ["fuzzel/**"]
# Section names.
extra_ignore_patterns = ['^\[colors\]$']

[[overrides]]
paths = ["fonts/**"]
extra_words = [
    "Libertinus",
    "Noto",
    "Twemoji",
]

[[overrides]]
paths = ["git/**"]
extra_words = [
    "difftool",
    "gradlew",
    "RUSTDOCFLAGS",
    "tformat",
    "WIP",
    "zdiff",
]

[[overrides]]
paths = [
    "**/*.sh",
    "*/data/theme-hooks/*",
    "spawn/data/spawn/*",
    "*/executables/*",
    "bash/**",
    "build",
    "git/configuration/git/config",
    "git/data/git-hooks/*",
]
extra_words = [
    "esac",
    "pipefail",
    "popd",
    "ppid",
    "pushd",
    "readarray",
    "shopt",
]

[[overrides]]
paths = ["status/executables/status"]
extra_words = ["ESC"]
# Printf format strings.
extra_ignore_patterns = ['%s\w+%s']

[[overrides]]
paths = ["niri/**/*.kdl"]
extra_words = [
    "accel",
    "clickfinger",
    "csd",
]
# Monitor names.
extra_ignore_patterns = ['^output ".*"']

[[overrides]]
paths = ["sh/.profile.esh"]
extra_words = [
    "MANPAGER",
    "MANROFFOPT",
    "roff",
]
# Arguments passed on to roff.
extra_ignore_patterns = ['-P-\w+']

[[overrides]]
paths = ["shellcheck/**"]
extra_words = ["SCRIPTDIR"]

[[overrides]]
paths = ["starship/**"]
extra_words = ["pipestatus"]

[[overrides]]
paths = ["system/grub/**"]
extra_words = [
    "gpt",
    "msdos",
    "rootfstype",
]

[[overrides]]
paths = ["system/locale/**"]
extra_words = ["dotdecimal"]

[[overrides]]
paths = ["system/locale/usr/local/share/i18n/locales/*"]
# Keywords of the locale definition format.
extra_words = [
    "abday",
    "abmon",
    "ampm",
    "noexpr",
    "nostr",
    "yesexpr",
    "yesstr",
]
# Swedish names and codes.
extra_ignore_patterns = [
    '"Sverige"',
    '"SWE"',
]

[[overrides]]
paths = ["system/mkinitcpio/**"]
# Hook names.
extra_words = [
    "consolefont",
    "kms",
    "modconf",
]

[[overrides]]
paths = ["system/pacman/**"]
extra_words = [
    "alpm",
    "multilib",
]

[[overrides]]
paths = ["system/pam/**"]
extra_words = ["keyring"]

[[overrides]]
paths = ["system/systemd/etc/systemd/resolved.conf.d/*"]
extra_words = [
    "DNSSEC",
    "TLS",
]

[[overrides]]
paths = ["system/udev/**"]
extra_words = [
    "FPGA",
    "FTDI",
    "uaccess",
    "ULX",
]

[[overrides]]
paths = ["swaylock/**"]
extra_words = ["datestr"]

[[overrides]]
paths = ["textadept/**"]
extra_words = [
    "bottommost",
    "csi",
    "Disambiguating",
    "EDITMSG",
    "ESC",
    "KEYSYMS",
    "resends",
]

[[overrides]]
paths = ["textadept/configuration/textadept/themes/*"]
extra_words = ["BBGGRR"]
# View properties defined by textadept.
extra_ignore_patterns = ['\bview\.\w+']

[[overrides]]
paths = ["waybar/configuration/waybar/config.jsonc"]
extra_words = [
    "acpi",
    "chromeos",
    "essid",
]

[[overrides]]
paths = ["zed/configuration/zed/settings.json"]
extra_words = ["calt"]

[[overrides]]
paths = ["zed/configuration/zed/keymap.json"]
extra_ignore_patterns = [
    '\w+::\w+', # Actions
    '"context":\s*"[^"]*"', # Contexts
]
