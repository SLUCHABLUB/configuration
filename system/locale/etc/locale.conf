# There are some pieces of software that don't understand how locale names are formatted, such as textadept.
# Therefore we set this as a fallback so they get that we're using UTF-8.
LANG=C.UTF-8

LC_CTYPE=en_SE.UTF-8@dotdecimal
LC_NUMERIC=en_SE.UTF-8@dotdecimal
LC_TIME=en_SE.UTF-8@dotdecimal
LC_COLLATE=en_SE.UTF-8@dotdecimal
LC_MONETARY=en_SE.UTF-8@dotdecimal
LC_MESSAGES=en_SE.UTF-8@dotdecimal
LC_PAPER=en_SE.UTF-8@dotdecimal
LC_NAME=en_SE.UTF-8@dotdecimal
LC_ADDRESS=en_SE.UTF-8@dotdecimal
LC_TELEPHONE=en_SE.UTF-8@dotdecimal
LC_MEASUREMENT=en_SE.UTF-8@dotdecimal
LC_IDENTIFICATION=en_SE.UTF-8@dotdecimal

LANGUAGE=en_GB:en
