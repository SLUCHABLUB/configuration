'$schema' = 'https://starship.rs/config-schema.json'

format = """\
    [\\[](fg:white)\
        $username\
        $hostname\
    [\\]](fg:white) \
    $git_branch\
    $git_status\
    $directory\
    $all\
    $status\
    $shell\
"""

add_newline = false

cmd_duration.disabled = true
line_break.disabled = true
package.disabled = true

c.disabled = true
cmake.disabled = true
golang.disabled = true
gradle.disabled = true
haskell.disabled = true
java.disabled = true
kotlin.disabled = true
nodejs.disabled = true
python.disabled = true
rust.disabled = true
typst.disabled = true
zig.disabled = true

# We use the shell module instead.
character.disabled = true

# TODO: Why does it display 3 normally?
shlvl.disabled = true

[username]
format = '[$user]($style)'
style_user = 'bright-purple'
show_always = true

[hostname]
format = ' @ [$hostname]($style)'
style = 'blue'

[git_branch]
format = '[$branch(:$remote_branch)]($style) '
style = 'bright-yellow'

[git_status]
format = """\
    (\
    [\\(](fg:white)\
    [\
    $conflicted\
    $ahead_behind\
    $staged\
    $modified\
    $untracked\
    $stashed\
    ]($style)\
    [\\)](fg:white) \
    )\
"""
style = 'red'

conflicted = 'X'
ahead = '↑'
behind = '↓'
diverged = '⇡'
staged = '+'
modified = '!'
untracked = '?'
stashed = ''

[directory]
format = '[$path]($style) '
style = 'blue'
truncation_length = -1

[sudo]
disabled = false
symbol = "\U0001F9D9\u200D\u2640" # Witch Emoji.

[jobs]
symbol = ''

[os]
disabled = false
[os.symbols]
Arch = "" # Arch is main for now.

[status]
format = '[\[](fg:white)[$status]($style)[\]](fg:white) '
pipestatus = true
pipestatus_format = '[\[](fg:white)$pipestatus[\]](fg:white) '
pipestatus_segment_format = '[$status]($style)'
pipestatus_separator = '[ | ](fg:white)'
disabled = false

[shell]
bash_indicator = '\$'
nu_indicator = '>'
unknown_indicator = '?'
disabled = false
